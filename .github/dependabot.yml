version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      versioning-strategy: increase
      cooldown:
          default-days: 3
          semver-patch-days: 3
          semver-minor-days: 3
          semver-major-days: 7
      labels:
          - dependencies
      groups:
          patch-and-minor:
              update-types:
                  - patch
                  - minor

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 3
          semver-patch-days: 3
          semver-minor-days: 3
          semver-major-days: 7
      labels:
          - dependencies
          - github-actions
      groups:
          patch-and-minor:
              update-types:
                  - patch
                  - minor
